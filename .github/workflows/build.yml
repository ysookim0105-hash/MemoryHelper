name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o /tmp/gradle-8.4.zip
          unzip -q /tmp/gradle-8.4.zip -d /tmp/gradle-dist
          WRAPPER_JAR=$(find /tmp/gradle-dist -name "gradle-wrapper*.jar" | head -1)
          echo "Found wrapper jar: $WRAPPER_JAR"
          cp "$WRAPPER_JAR" gradle/wrapper/gradle-wrapper.jar

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoryHelper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
